[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-plugin-for-talos"
version = "1.0.0"
authors = [
  { name="Sarvesh", email="sarvesh173@users.noreply.github.com" },
]
description = "OpenCode Plugin for TALOS: Real-time CLI agent linking, session tracking, and execution"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
