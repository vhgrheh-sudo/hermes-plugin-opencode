[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-plugin-opencode"
version = "1.0.0"
authors = [
  { name="Sarvesh", email="sarvesh173@users.noreply.github.com" },
]
description = "OpenCode CLI bridge plugin for Hermes Agent with real-time session tracking, live polling, and agent delegation"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
